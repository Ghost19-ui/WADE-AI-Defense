<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WADE Command Center</title>
    <style>
        :root {
            --bg-dark: #0a0a0c;
            --panel-bg: #141419;
            --primary-cyan: #00f3ff;
            --danger-red: #ff3366;
            --safe-green: #00ff66;
            --text-main: #e0e0e0;
            --text-muted: #888899;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 95%; max-width: 1400px; }

        .header {
            text-align: center; border-bottom: 2px solid var(--primary-cyan);
            padding-bottom: 15px; margin-bottom: 30px;
        }
        .header h1 { color: var(--primary-cyan); margin: 0; text-transform: uppercase; letter-spacing: 2px; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background-color: var(--panel-bg); border: 1px solid #333; border-radius: 8px; padding: 20px; text-align: center; }
        .stat-card h3 { margin: 0 0 10px 0; color: var(--text-muted); font-size: 14px; }
        .stat-card .value { font-size: 32px; font-weight: bold; color: var(--primary-cyan); }

        .tables-grid { display: grid; grid-template-columns: 2fr 1.5fr; gap: 20px; }
        .side-panels { display: flex; flex-direction: column; gap: 20px; }
        
        .data-panel { background-color: var(--panel-bg); border: 1px solid #333; border-radius: 8px; padding: 20px; }
        .data-panel h2 { margin-top: 0; color: var(--primary-cyan); font-size: 18px; border-bottom: 1px solid #333; padding-bottom: 10px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #222; font-size: 13px; }
        th { color: var(--text-muted); font-size: 11px; text-transform: uppercase; }

        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge.safe { background-color: rgba(0, 255, 102, 0.1); color: var(--safe-green); border: 1px solid var(--safe-green); }
        .badge.danger { background-color: rgba(255, 51, 102, 0.1); color: var(--danger-red); border: 1px solid var(--danger-red); }
        .badge.warning { background-color: rgba(255, 165, 0, 0.1); color: orange; border: 1px solid orange; }

        .empty-state { text-align: center; padding: 20px; color: var(--text-muted); font-style: italic; }

        /* Interactive Elements */
        .btn-action { padding: 5px 10px; font-size: 11px; font-weight: bold; cursor: pointer; border: none; border-radius: 3px; font-family: inherit; margin-right: 5px;}
        .btn-white { background: rgba(0, 255, 102, 0.2); color: var(--safe-green); border: 1px solid var(--safe-green); }
        .btn-black { background: rgba(255, 51, 102, 0.2); color: var(--danger-red); border: 1px solid var(--danger-red); }
        .btn-remove { background: transparent; color: #888; border: 1px solid #555; }
        .btn-action:hover { filter: brightness(1.5); }

        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .input-group input { flex: 1; padding: 8px; background: #050505; border: 1px solid #333; color: white; font-family: inherit; border-radius: 4px;}
        .input-group button { padding: 8px 15px; font-weight: bold; cursor: pointer; font-family: inherit; border-radius: 4px; border: none; }
        .add-white-btn { background: var(--safe-green); color: black; }
        .add-black-btn { background: var(--danger-red); color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ WADE Intelligence Command Center</h1>
            <p>Real-Time Threat Analytics & Access Controls</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Scans Logged</h3>
                <div class="value" id="stat-total-scans">0</div>
            </div>
            <div class="stat-card">
                <h3>Force Blocked Domains</h3>
                <div class="value" id="stat-blocked" style="color: var(--danger-red);">0</div>
            </div>
            <div class="stat-card">
                <h3>Custom Whitelisted</h3>
                <div class="value" id="stat-trusted" style="color: var(--safe-green);">0</div>
            </div>
        </div>

        <div class="tables-grid">
            <div class="data-panel">
                <h2>📡 Recent Scan Activity</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Target URL</th>
                            <th>Risk</th>
                            <th>Verdict</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="history-table-body"></tbody>
                </table>
            </div>

            <div class="side-panels">
                <div class="data-panel">
                    <h2 style="color: var(--safe-green);">✅ Trusted Whitelist</h2>
                    <div class="input-group">
                        <input type="text" id="whitelist-input" placeholder="e.g., safe-school.edu">
                        <button class="add-white-btn" id="add-whitelist">Trust</button>
                    </div>
                    <table>
                        <tbody id="whitelist-table-body"></tbody>
                    </table>
                </div>

                <div class="data-panel">
                    <h2 style="color: var(--danger-red);">🚫 Force Blacklist</h2>
                    <div class="input-group">
                        <input type="text" id="blacklist-input" placeholder="e.g., evil-phishing.com">
                        <button class="add-black-btn" id="add-blacklist">Block</button>
                    </div>
                    <table>
                        <tbody id="blacklist-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="dashboard.js"></script>
</body>
</html>
